<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>ProdMesh</title>
    <style>
      /* System fonts and status.html's palette: one small window, no webfonts. */
      :root {
        --bg: #0b1017;
        --raised: #131b24;
        --border: #22303d;
        --text: #edf2f7;
        --dim: #8fa3b5;
        --accent: #52a8ff;
        --ok: #34c759;
        --warn: #ffb020;
        --bad: #ff4d4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 22px 24px 20px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 { margin: 0 0 2px; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
      .ver { color: var(--dim); font-size: 11px; margin-bottom: 16px; }
      .label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0 0 8px;
      }
      .spin {
        width: 9px; height: 9px; border-radius: 50%;
        border: 1.5px solid var(--dim); border-top-color: transparent;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .card {
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 4px 0;
        margin-bottom: 16px;
      }
      .found { list-style: none; margin: 0; padding: 0; max-height: 216px; overflow-y: auto; }
      .found li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 14px;
      }
      .found li + li { border-top: 1px solid var(--border); }
      .found .who { flex: 1; min-width: 0; }
      .found .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .found .where { color: var(--dim); font-size: 11.5px; }
      .found .dup { color: var(--warn); font-size: 11.5px; }
      .empty { color: var(--dim); padding: 10px 14px; margin: 0; }
      button {
        font: inherit;
        font-weight: 600;
        color: #04121f;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.quiet { color: var(--text); background: transparent; border: 1px solid var(--border); }
      button:disabled { opacity: 0.45; cursor: default; }
      .manual { display: flex; gap: 8px; margin-bottom: 6px; }
      input {
        flex: 1;
        font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        -webkit-user-select: text;
        user-select: text;
      }
      input:focus { outline: none; border-color: var(--accent); }
      .err { color: var(--bad); font-size: 12px; min-height: 18px; margin: 0 0 10px; }
      hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0 16px; }
      .host { display: flex; align-items: center; gap: 12px; }
      .host p { flex: 1; margin: 0; color: var(--dim); font-size: 12px; }
      .host strong { display: block; color: var(--text); font-size: 13px; }
      .now { color: var(--ok); font-size: 12px; margin: -8px 0 14px; }
    </style>
  </head>
  <body>
    <h1>ProdMesh</h1>
    <div class="ver" id="ver"></div>
    <p class="now" id="now" hidden></p>

    <p class="label"><span>Servers on this network</span><span class="spin" id="spin"></span></p>
    <div class="card">
      <ul class="found" id="found"></ul>
      <p class="empty" id="empty" hidden>None found yet. A server on another network or VLAN won't appear: enter its address.</p>
    </div>

    <p class="label">Address</p>
    <form class="manual" id="manual">
      <input id="address" placeholder="192.168.1.20:8080" spellcheck="false" autocomplete="off" aria-label="Server address" />
      <button type="submit" class="quiet" id="go">Connect</button>
    </form>
    <p class="err" id="err" role="alert"></p>

    <hr />
    <div class="host">
      <p><strong>Run the server on this computer</strong>Rooms and other computers connect to it. It has to stay on during services.</p>
      <button class="quiet" id="serve">Run here</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let busy = false;
      let mode = 'choose';

      const setBusy = (b) => {
        busy = b;
        for (const el of document.querySelectorAll('button')) el.disabled = b || el.dataset.blocked === '1';
      };

      async function act(fn) {
        if (busy) return;
        setBusy(true);
        $('err').textContent = '';
        try {
          const r = await fn();
          if (r && r.error) $('err').textContent = r.error;
        } catch (e) {
          $('err').textContent = String(e && e.message || e);
        } finally {
          setBusy(false);
        }
      }

      function render(list) {
        $('found').innerHTML = '';
        $('empty').hidden = list.length > 0;
        for (const s of list) {
          const li = document.createElement('li');
          const who = document.createElement('div');
          who.className = 'who';
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = s.name;
          const where = document.createElement('div');
          where.className = s.duplicate ? 'dup' : 'where';
          where.textContent = s.duplicate
            ? `Two computers are running as this server (${s.host || 'unknown'}). Switch one off.`
            : [s.host, s.version && `v${s.version}`].filter(Boolean).join(' · ');
          who.append(name, where);
          const b = document.createElement('button');
          b.textContent = s.current ? (mode === 'server' ? 'This computer' : 'Connected') : 'Connect';
          b.dataset.blocked = s.duplicate || s.current ? '1' : '0';
          b.disabled = busy || b.dataset.blocked === '1';
          b.addEventListener('click', () => act(() => window.prodmesh.connectFound(s.systemId)));
          li.append(who, b);
          $('found').append(li);
        }
      }

      // Keep looking while the window is open: a server switched on after the
      // window opened should still turn up.
      async function look() {
        try { render(await window.prodmesh.discover()); } catch { /* next round */ }
        $('spin').hidden = false;
        setTimeout(look, 4000);
      }

      $('manual').addEventListener('submit', (e) => {
        e.preventDefault();
        act(() => window.prodmesh.connectAddress($('address').value));
      });
      $('serve').addEventListener('click', () => act(() => window.prodmesh.runServer()));

      window.prodmesh.info().then((i) => {
        $('ver').textContent = `Version ${i.version}`;
        mode = i.mode;
        if (i.mode === 'server') {
          $('now').hidden = false;
          $('now').textContent = 'This computer is running the server.';
          $('serve').textContent = 'Running';
          $('serve').dataset.blocked = '1';
          $('serve').disabled = true;
        } else if (i.mode === 'client' && i.server) {
          $('now').hidden = false;
          $('now').textContent = `Connected to ${i.server}.`;
        }
      });
      look();
    </script>
  </body>
</html>
