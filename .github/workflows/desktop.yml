name: Desktop launcher

# Builds the tray app for macOS and Windows.
#
# Runs on every branch so a broken build surfaces here rather than on release
# day — but only a `v*` tag publishes installers, matching the rule that tags,
# not main, are the deployment channel.
#
# `push` only, and deliberately no `pull_request` — the one workflow that skips
# outside PRs. A macOS + Windows matrix on every external contribution is real
# runner minutes for a launcher most PRs never touch, and a fork gets no signing
# secrets, so the build it produced would be unsigned and prove less than it
# appears to. The maintainer's own push after merge is where this gets caught.
# If a PR does touch the launcher, run it by hand with workflow_dispatch.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      # Rebuild an existing release with THIS workflow, not the tag's own.
      # Re-running a tag's run replays the workflow file frozen at that tag, so
      # when the tag's file is what broke — GitHub retiring the macos-14 image
      # cancelled v1.4.0's mac job before a single step — a re-run fails the
      # same way. Moving the tag is not the answer either: Docker has already
      # published from it and update.sh boxes may have checked it out. So run
      # this from main with the tag named here: it builds the tag's code and
      # uploads only the assets the release is missing, never replacing one
      # that already shipped.
      tag:
        description: 'Existing release tag to rebuild (e.g. v1.4.0); empty for a normal build'
        required: false
        default: ''

concurrency:
  # The tag is part of the group so a push to main cannot cancel a rebuild
  # dispatched from main.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false # a Windows failure should not hide a working mac build
      matrix:
        include:
          # GitHub retires runner images on a schedule and the job is then
          # cancelled with no steps run ("The configuration
          # 'macos-14-arm64-us-default' is not supported"), which is how v1.4.0
          # shipped without mac installers. If the mac job shows cancelled in
          # about a second, check the image before anything else.
          - os: macos-15
            platform: mac
          - os: windows-2022
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    # The repository default is read-only, so publishing a release 403s with
    # "Resource not accessible by integration" — which reads like a token or
    # scope problem and is neither. Declared per job rather than repo-wide, so
    # it is version-controlled and visible next to the step that needs it.
    # Only tag builds actually publish; branch builds pass --publish never.
    permissions:
      contents: write

    steps:
      # Fail before spending runner minutes on a typo or on a tag that has no
      # release to fill in.
      - name: Check the rebuild tag
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::no GitHub release for $TAG"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # empty → the triggering ref, as before
          fetch-depth: 0 # build.mjs stamps the commit

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The frontend must exist before staging: build.mjs refuses without it,
      # because an app packaged around an empty dist/ serves a blank page and
      # looks like a server fault.
      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Install launcher toolchain
        run: npm ci --prefix desktop

      # Signing only when the secrets are present, so forks and branch builds
      # still produce something testable instead of failing.
      - name: Check signing availability
        id: signing
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ] && [ -n "${{ secrets.MACOS_CERT_P12 }}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      # Prove the two certificate secrets agree BEFORE electron-builder uses
      # them. Its failure for a wrong password is a PKCS12 stack trace ending
      # "MAC verification failed during PKCS12 import (wrong password?)", which
      # names neither secret and reads like a corrupt certificate. This says
      # which one to fix.
      - name: Preflight the signing certificate
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          P12="${RUNNER_TEMP}/preflight.p12"
          KC="${RUNNER_TEMP}/preflight.keychain"
          if ! printf '%s' "$CERT_B64" | base64 --decode > "$P12" 2>/dev/null || [ ! -s "$P12" ]; then
            echo "::error::MACOS_CERT_P12 is not valid base64. Set it with: gh secret set MACOS_CERT_P12 < cert.p12.b64"
            exit 1
          fi
          security create-keychain -p "" "$KC"
          security unlock-keychain -p "" "$KC"
          if ! security import "$P12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "::error::MACOS_CERT_P12_PASSWORD does not open MACOS_CERT_P12. The certificate itself decoded fine, so re-set the PASSWORD secret — a trailing newline or a truncated paste is the usual cause. Use: gh secret set MACOS_CERT_P12_PASSWORD < password.txt"
            security delete-keychain "$KC"; exit 1
          fi
          FOUND=$(security find-identity -v -p codesigning "$KC" | grep -c "Developer ID Application" || true)
          security delete-keychain "$KC"
          rm -f "$P12"
          if [ "$FOUND" -lt 1 ]; then
            echo "::error::The .p12 opened but holds no \"Developer ID Application\" identity with a private key. Export it with: security export -t identities -f pkcs12"
            exit 1
          fi
          echo "✓ certificate and password agree, and it carries a Developer ID Application identity"

      # notarytool authenticates with an App Store Connect API key rather than
      # an Apple ID + app-specific password. It has to exist as a FILE on disk,
      # so the base64 secret is decoded into the runner's temp dir — never the
      # workspace, which gets archived as build artefacts.
      - name: Stage the notarization key
        if: steps.signing.outputs.sign == 'true'
        id: apikey
        shell: bash
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYFILE="${RUNNER_TEMP}/apple_api_key.p8"
          printf '%s' "$KEY_B64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          echo "path=$KEYFILE" >> "$GITHUB_OUTPUT"

      - name: Build (signed + notarized)
        if: steps.signing.outputs.sign == 'true'
        working-directory: desktop
        env:
          # Signing: the Developer ID Application certificate, base64 .p12.
          CSC_LINK: ${{ secrets.MACOS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          # Notarization: App Store Connect API key.
          APPLE_API_KEY: ${{ steps.apikey.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      # The private key is short-lived on the runner anyway, but leaving it for
      # the rest of the job is free risk.
      - name: Remove the notarization key
        if: always() && steps.apikey.outputs.path != ''
        shell: bash
        run: rm -f "${{ steps.apikey.outputs.path }}"

      - name: Build (unsigned)
        if: steps.signing.outputs.sign != 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a certificate, asking electron-builder to sign fails the
          # run; an unsigned artefact is still worth having for testing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      # The status window is the only interactive surface in the launcher, and
      # its one button silently did nothing once — a sandboxed preload has no
      # `shell`, so the call failed in the renderer console where nobody looks.
      - name: Test the status window
        working-directory: desktop
        run: npm test

      # The launcher's whole promise is "double-click and a dashboard appears",
      # so a build producing an app that cannot start is worse than no build.
      #
      # This runs the PACKAGED BINARY, not desktop/.build. The staging tree is
      # shared across architectures and electron-builder rebuilds the native
      # module into it once per arch, so after a mac [arm64, x64] build it
      # holds whichever came last — x64 — and cannot load on an arm64 runner.
      # The packaged app is the thing being shipped and each one got its own
      # correctly-built binary, so it is also the honest thing to test.
      #
      # Only the runner's own architecture is exercised; the cross-built app
      # cannot be executed here.
      - name: Smoke-test the packaged app
        working-directory: desktop
        shell: bash
        env:
          PRODMESH_SMOKE: '1'
          PORT: '8123'
        run: |
          set -e
          if [ "${{ matrix.platform }}" = "mac" ]; then
            APP=$(ls -d release/mac-arm64/ProdMesh.app 2>/dev/null || ls -d release/mac/ProdMesh.app)
            BIN="$APP/Contents/MacOS/ProdMesh"
          else
            BIN="release/win-unpacked/ProdMesh.exe"
          fi
          echo "smoke-testing $BIN"
          [ -e "$BIN" ] || { echo "::error::packaged binary not found at $BIN"; ls -R release | head -40; exit 1; }
          "$BIN"

      # A rebuild built with --publish never (github.ref is main), so upload
      # here instead. Only missing assets: one that is already on the release
      # has been downloaded and auto-updated against, and its latest*.yml
      # hashes describe that exact file. electron-builder's own publish is no
      # good for this either — it may refuse a release that was published
      # rather than drafted.
      - name: Upload missing assets to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          shopt -s nullglob
          for f in desktop/release/*.dmg desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest*.yml; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$have"; then
              echo "keep    $name (already on $TAG)"
            else
              echo "upload  $name"
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prodmesh-${{ matrix.platform }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14
